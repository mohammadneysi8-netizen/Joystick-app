<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e90ff">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>تست جوی‌استیک</title>
<style>
:root{
  --ring:rgba(255,255,255,.55);
  --ring-fill:rgba(0,0,0,.18);
  --knob:rgba(255,255,255,.9);
  --label:#111;
  --hint:rgba(255,255,255,.85);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--ring:rgba(255,255,255,.4);--ring-fill:rgba(0,0,0,.3);--knob:rgba(255,255,255,.85);--label:#111;--hint:rgba(255,255,255,.8)}
}
:root[data-theme="dark"]{--ring:rgba(255,255,255,.4);--ring-fill:rgba(0,0,0,.3);--knob:rgba(255,255,255,.85);--label:#111;--hint:rgba(255,255,255,.8)}
html,body{height:100%;margin:0;overflow:hidden;background:hsl(210,90%,50%);
  font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
body{transition:background-color .08s linear}
#hint{position:fixed;top:calc(env(safe-area-inset-top,0px) + 16px);left:0;right:0;text-align:center;
  color:var(--hint);font-size:15px;line-height:1.7;padding:0 24px;text-shadow:0 1px 3px rgba(0,0,0,.45)}
#stick{position:fixed;left:24px;bottom:calc(env(safe-area-inset-bottom,0px) + 32px);
  width:160px;height:160px;border-radius:50%;background:var(--ring-fill);border:3px solid var(--ring)}
#knob{position:absolute;left:50%;top:50%;width:70px;height:70px;margin:-35px 0 0 -35px;
  border-radius:50%;background:var(--knob);box-shadow:0 2px 8px rgba(0,0,0,.35)}
.btn{position:fixed;width:84px;height:84px;border-radius:50%;border:3px solid var(--ring);
  font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center;
  box-shadow:0 3px 10px rgba(0,0,0,.35)}
.btn:active,.btn.down{transform:scale(.93)}
#white{right:28px;bottom:calc(env(safe-area-inset-bottom,0px) + 100px);background:#fff;color:var(--label)}
#black{right:120px;bottom:calc(env(safe-area-inset-bottom,0px) + 44px);background:#000;color:#fff}
</style>
</head>
<body>
<div id="hint">جوی‌استیک را حرکت بده تا رنگ عوض شود.<br>دکمه‌ها صفحه را سیاه یا سفید می‌کنند.</div>
<div id="stick"><div id="knob"></div></div>
<div class="btn" id="black">سیاه</div>
<div class="btn" id="white">سفید</div>
<script>
(function(){
  var stick=document.getElementById('stick'),knob=document.getElementById('knob');
  var R=45,active=null;
  function setColor(c){document.body.style.background=c;document.documentElement.style.background=c}
  function move(e){
    var r=stick.getBoundingClientRect();
    var dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);
    var d=Math.sqrt(dx*dx+dy*dy),k=d>R?R/d:1;
    knob.style.transform='translate('+(dx*k)+'px,'+(dy*k)+'px)';
    if(d>12){
      // Direction angle becomes hue: right = 0, down = 90, left = 180, up = 270
      var a=Math.atan2(dy,dx)*180/Math.PI;if(a<0)a+=360;
      setColor('hsl('+Math.round(a)+',90%,50%)');
    }
  }
  stick.addEventListener('pointerdown',function(e){active=e.pointerId;stick.setPointerCapture(e.pointerId);move(e);e.preventDefault()});
  stick.addEventListener('pointermove',function(e){if(e.pointerId===active)move(e)});
  function end(e){if(e.pointerId===active){active=null;knob.style.transform='translate(0,0)'}}
  stick.addEventListener('pointerup',end);
  stick.addEventListener('pointercancel',end);
  document.getElementById('black').addEventListener('pointerdown',function(e){setColor('#000');e.preventDefault()});
  document.getElementById('white').addEventListener('pointerdown',function(e){setColor('#fff');e.preventDefault()});
  document.addEventListener('contextmenu',function(e){e.preventDefault()});
})();
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
</script>
</body>
</html>
